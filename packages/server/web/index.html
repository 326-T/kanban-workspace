<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kanban-workspace</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #0f1115; color: #e6e6e6; }
  #root { height: 100vh; }
  .app { display: flex; height: 100%; }
  .warnbar { position: fixed; top: 0; right: 0; background: #3a2b09; color: #fbbf24; font-size: 11px; padding: 3px 10px; border-bottom-left-radius: 8px; z-index: 10; }
  .sidebar { width: 320px; border-right: 1px solid #262a33; padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex-shrink: 0; }
  .brand { font-weight: 700; font-size: 15px; }
  .brand small { color: #8a91a0; font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
  .newrun { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid #262a33; border-radius: 10px; }
  textarea, input[type=text] { width: 100%; background: #171a21; color: #e6e6e6; border: 1px solid #2c313c; border-radius: 6px; padding: 8px; font: inherit; font-size: 13px; }
  textarea:focus, input:focus { outline: none; border-color: #3b82f6; }
  button { background: #3b82f6; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: #262a33; }
  button.deny { background: #b91c1c; }
  label.chk { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #aab; cursor: pointer; }
  .runlist { display: flex; flex-direction: column; gap: 8px; }
  .runitem { padding: 8px 10px; border: 1px solid #262a33; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .runitem:hover { border-color: #3b4152; }
  .runitem.sel { border-color: #3b82f6; }
  .runitem .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
  .runitem .p { color: #aab; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cost { color: #8a91a0; font-size: 11px; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #262a33; white-space: nowrap; }
  .badge.running { background: #1d4ed8; }
  .badge.waiting_input { background: #a16207; }
  .badge.completed { background: #15803d; }
  .badge.failed { background: #b91c1c; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .timeline { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .msg { background: #171a21; border: 1px solid #262a33; border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; max-width: 840px; font-size: 14px; line-height: 1.6; }
  .tool { color: #8a91a0; font-size: 12px; font-family: ui-monospace, SFMono-Regular, monospace; word-break: break-all; }
  .tool.err { color: #f87171; }
  .divider { color: #667; font-size: 12px; }
  .perm { border: 1px solid #a16207; background: #1c1710; border-radius: 10px; padding: 12px 14px; max-width: 840px; }
  .perm .t { font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  .perm .i { font-family: ui-monospace, monospace; font-size: 12px; color: #c9bda0; margin-bottom: 10px; word-break: break-all; }
  .perm .btns { display: flex; gap: 8px; }
  .banner { border-radius: 10px; padding: 10px 14px; max-width: 840px; font-size: 13px; }
  .banner.ok { background: #0c1f12; border: 1px solid #15803d; }
  .banner.ng { background: #1f0c0c; border: 1px solid #b91c1c; }
  .composer { display: flex; gap: 8px; padding: 12px 22px; border-top: 1px solid #262a33; }
  .composer textarea { flex: 1; resize: none; height: 46px; }
  .empty { color: #667; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
